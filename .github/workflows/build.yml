name: Build vWii

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        run: .\\build\\Release\\vwii.exe --self-test

      - name: Smoke test executable (macOS)
        if: runner.os == 'macOS'
        run: ./build/vwii.app/Contents/MacOS/vwii --self-test
