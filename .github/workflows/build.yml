name: Build vWii

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/vwii.exe --self-test

      - name: Smoke test executable (macOS)
        if: runner.os == 'macOS'
        run: ./build/vwii.app/Contents/MacOS/vwii --self-test

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\vwii.exe dist\vwii.exe
          Compress-Archive -Path dist\vwii.exe -DestinationPath "vWii-$env:GITHUB_SHA-Windows-x64.zip"

      - name: Upload Windows release artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vWii-Windows-x64
          path: vWii-${{ github.sha }}-Windows-x64.zip
          if-no-files-found: error

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          test -d build/vwii.app
          rm -rf dist dmg-root
          mkdir -p dist dmg-root
          cp -R build/vwii.app dist/vWii.app
          codesign --force --deep --sign - dist/vWii.app
          cp -R dist/vWii.app dmg-root/vWii.app
          hdiutil create             -volname "vWii"             -srcfolder dmg-root             -ov             -format UDZO             "vWii-$GITHUB_SHA-macOS.dmg"

      - name: Upload macOS release artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vWii-macOS
          path: vWii-${{ github.sha }}-macOS.dmg
          if-no-files-found: error
