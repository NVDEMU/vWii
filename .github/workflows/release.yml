name: Release vWii

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\vwii.exe dist\vwii.exe
          Compress-Archive -Path dist\vwii.exe -DestinationPath "vWii-${env:GITHUB_REF_NAME}-Windows-x64.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vWii-Windows-x64
          path: vWii-${{ github.ref_name }}-Windows-x64.zip

  macos:
    name: macOS build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package .app
        run: |
          set -euo pipefail
          test -d build/vwii.app
          mkdir -p dist
          cp -R build/vwii.app "dist/vWii.app"
          codesign --force --deep --sign - "dist/vWii.app"

      - name: Create DMG
        run: |
          set -euo pipefail
          hdiutil create \
            -volname "vWii" \
            -srcfolder "dist/vWii.app" \
            -ov \
            -format UDZO \
            "vWii-${GITHUB_REF_NAME}-macOS.dmg"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vWii-macOS
          path: vWii-${{ github.ref_name }}-macOS.dmg

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vWii-Windows-x64
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: vWii-macOS
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            release-assets/*
